# Clinical Knowledge Base for Lab Tests
# Used to ground LLM explanations and prevent medical hallucinations.

hemoglobin:
  description: "A protein in red blood cells that carries oxygen throughout your body."
rbc:
  description: "Red blood cells are responsible for transporting oxygen from your lungs to the rest of your body."
wbc:
  description: "White blood cells are part of the body's immune system, helping to fight infections and other diseases."
platelet:
  description: "Small blood cell fragments that help your blood clot to stop bleeding."
hematocrit:
  description: "The proportion of your total blood volume that is composed of red blood cells."
mcv:
  description: "Mean Corpuscular Volume measures the average size of your red blood cells."
fasting_glucose:
  description: "Measures the amount of sugar (glucose) in your blood after an overnight fast."
random_glucose:
  description: "Measures the amount of sugar (glucose) in your blood at any time of day, regardless of when you last ate."
hba1c:
  description: "Measures your average blood sugar levels over the past two to three months."
total_cholesterol:
  description: "The total amount of cholesterol in your blood, including HDL and LDL."
ldl:
  description: "Low-density lipoprotein (LDL) is often called 'bad' cholesterol because it can build up in your arteries."
hdl:
  description: "High-density lipoprotein (HDL) is 'good' cholesterol because it helps remove other forms of cholesterol from your bloodstream."
triglycerides:
  description: "A type of fat (lipid) found in your blood; high levels can increase heart disease risk."
sodium:
  description: "An electrolyte that helps maintain the balance of water in and around your cells."
potassium:
  description: "An electrolyte that helps your nerves function and muscles contract, including your heart."
creatinine:
  description: "A waste product from muscle breakdown that is filtered out by the kidneys; used to measure kidney function."
bun:
  description: "Blood Urea Nitrogen measures the amount of nitrogen in your blood that comes from the waste product urea, indicating kidney health."
alt:
  description: "Alanine Aminotransferase is an enzyme found mainly in the liver; high levels can indicate liver damage."
ast:
  description: "Aspartate Aminotransferase is an enzyme found in the liver, heart, and muscles; used to assess liver or muscle health."
total_bilirubin:
  description: "A yellow pigment formed during the normal breakdown of red blood cells; high levels may indicate liver or bile duct issues."
tsh:
  description: "Thyroid Stimulating Hormone regulates how much thyroid hormone your thyroid gland releases."
vitamin_d:
  description: "A nutrient your body needs for building and maintaining healthy bones and immune function."
crp:
  description: "C-Reactive Protein is a substance produced by the liver in response to inflammation in the body."
inr:
  description: "International Normalized Ratio measures how long it takes for your blood to clot."
uric_acid:
  description: "A waste product found in blood; high levels can lead to gout or kidney stones."
calcium:
  description: "One of the most important minerals in the body; essential for bones, teeth, and heart function."
albumin:
  description: "A protein made by your liver that helps keep fluid in your bloodstream and carries substances throughout the body."
