
version: v0.1.0

default_radius_km: 50

specialty_mapping:
  - prefix: "I21"
    specialty: Cardiologist
  - prefix: "I26"
    specialty: Cardiologist
  - prefix: "I50"
    specialty: Cardiologist
  - prefix: "I10"
    specialty: Cardiologist
  - prefix: "I11"
    specialty: Cardiologist
  - prefix: "I"
    specialty: Cardiologist

  - prefix: "J45"
    specialty: Pulmonologist
  - prefix: "J18"
    specialty: Pulmonologist
  - prefix: "J06"
    specialty: General Physician
  - prefix: "J00"
    specialty: General Physician
  - prefix: "J"
    specialty: Pulmonologist

  - prefix: "E11"
    specialty: Endocrinologist
  - prefix: "E10"
    specialty: Endocrinologist
  - prefix: "E"
    specialty: Endocrinologist

  - prefix: "K59"
    specialty: Gastroenterologist
  - prefix: "K"
    specialty: Gastroenterologist

  - prefix: "N"
    specialty: Nephrologist

  - prefix: "R51"
    specialty: Neurologist
  - prefix: "R50"
    specialty: General Physician
  - prefix: "R"
    specialty: General Physician

  - prefix: "F"
    specialty: Psychiatrist

default_specialty: General Physician

scoring_weights:
  specialty_match: 0.40
  proximity: 0.30
  availability: 0.20
  rating: 0.10

specialty_match:
  exact: 1.0
  partial: 0.3
  generalist_partial: 0.5

availability:
  same_day_match: 1.0
  same_day_miss: 0.0
  routine_match: 1.0
  routine_miss: 0.7

urgency_policy:
  EMERGENCY:
    sort_by: distance
    require_same_day: true
    drop_irrelevant_specialty: true
    max_results: 5
  URGENT:
    sort_by: distance
    require_same_day: true
    drop_irrelevant_specialty: true
    max_results: 5
  HIGH:
    sort_by: score
    require_same_day: false
    drop_irrelevant_specialty: false
    max_results: 5
  MEDIUM:
    sort_by: score
    require_same_day: false
    drop_irrelevant_specialty: false
    max_results: 5
  LOW:
    sort_by: score
    require_same_day: false
    drop_irrelevant_specialty: false
    max_results: 5
