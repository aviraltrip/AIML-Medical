# Hardcoded vital-sign safety rails. LLM CANNOT override.
# Source: WHO Emergency Triage + MOHFW + NHS pathways.
# Validated by clinical reviewer (see docs/clinical-validation.md).

version: v0.1.0

# Tier rank order (higher = more severe). Used to take max across rules.
tier_rank:
  LOW: 0
  MEDIUM: 1
  HIGH: 2
  URGENT: 3
  EMERGENCY: 4

rules:
  - id: bp_hypertensive_crisis
    metric_pair: [bp_systolic, bp_diastolic]
    op: any_gte
    value: [180, 120]
    tier: EMERGENCY
    message: "Blood pressure in hypertensive crisis range (>180/120 mmHg) — urgent referral required."

  - id: bp_stage2_hypertension
    metric_pair: [bp_systolic, bp_diastolic]
    op: any_gte
    value: [160, 100]
    tier: URGENT
    message: "Blood pressure in Stage 2 Hypertension range (>=160/100 mmHg) — medical evaluation recommended."

  - id: bp_stage1_hypertension
    metric_pair: [bp_systolic, bp_diastolic]
    op: any_gte
    value: [140, 90]
    tier: HIGH
    message: "Blood pressure in Stage 1 Hypertension range (>=140/90 mmHg) — lifestyle counseling and follow-up recommended."

  - id: blood_sugar_severe_hypo
    metric: blood_sugar_mg_dl
    op: lt
    value: 50
    tier: EMERGENCY
    message: "Severe hypoglycemia (<50 mg/dL) — urgent treatment and medical evaluation required."

  - id: blood_sugar_severe_hyper
    metric: blood_sugar_mg_dl
    op: gte
    value: 400
    tier: EMERGENCY
    message: "Severe hyperglycemia (>=400 mg/dL) — urgent referral to prevent diabetic complications."

  - id: blood_sugar_diabetic_risk
    metric: blood_sugar_mg_dl
    op: gte
    value: 126
    tier: URGENT
    message: "Fasting or random blood sugar suggests high diabetic risk (>=126 mg/dL) — confirmatory glucose/HbA1c testing recommended."

  - id: blood_sugar_abnormal
    metric: blood_sugar_mg_dl
    op: gte
    value: 100
    tier: HIGH
    message: "Blood sugar is elevated (>=100 mg/dL), suggesting prediabetes — lifestyle changes and monitoring recommended."
