# Reference ranges for 40+ common lab tests.
# Sources: WHO, MOHFW STG, Lab Tests Online, Mayo Clinic.
# Each entry specifies aliases (regex-friendly), unit, and gender/age-aware ranges.
# Reviewed by clinical teammate.

version: v0.1.0

tests:
  hemoglobin:
    aliases: ["hb", "hgb", "hemoglobin", "haemoglobin"]
    unit: "g/dL"
    ranges:
      male_adult:    { low: 13.5, high: 17.5 }
      female_adult:  { low: 12.0, high: 15.5 }
      pediatric:     { low: 11.0, high: 16.0 }

  rbc:
    aliases: ["rbc", "red blood cell"]
    unit: "x10^12/L"
    ranges:
      male_adult:    { low: 4.5, high: 5.9 }
      female_adult:  { low: 4.1, high: 5.1 }

  wbc:
    aliases: ["wbc", "white blood cell", "tlc", "total leukocyte count"]
    unit: "x10^9/L"
    ranges:
      adult: { low: 4.0, high: 11.0 }

  platelet:
    aliases: ["platelet", "plt"]
    unit: "x10^9/L"
    ranges:
      adult: { low: 150, high: 450 }

  hematocrit:
    aliases: ["hct", "hematocrit", "pcv"]
    unit: "%"
    ranges:
      male_adult:    { low: 41, high: 53 }
      female_adult:  { low: 36, high: 46 }

  mcv:
    aliases: ["mcv"]
    unit: "fL"
    ranges:
      adult: { low: 80, high: 100 }

  fasting_glucose:
    aliases: ["fasting glucose", "fbs", "fasting blood sugar"]
    unit: "mg/dL"
    ranges:
      adult: { low: 70, high: 100 }

  random_glucose:
    aliases: ["rbs", "random blood sugar", "random glucose"]
    unit: "mg/dL"
    ranges:
      adult: { low: 70, high: 140 }

  hba1c:
    aliases: ["hba1c", "hb-a1c", "hb a1c", "hba-1c", "hba 1c", "glycated hemoglobin", "glycohemoglobin"]
    unit: "%"
    ranges:
      adult: { low: 4.0, high: 5.6 }

  total_cholesterol:
    aliases: ["total cholesterol", "cholesterol total"]
    unit: "mg/dL"
    ranges:
      adult: { low: 0, high: 200 }

  ldl:
    aliases: ["ldl", "ldl cholesterol"]
    unit: "mg/dL"
    ranges:
      adult: { low: 0, high: 100 }

  hdl:
    aliases: ["hdl", "hdl cholesterol"]
    unit: "mg/dL"
    ranges:
      male_adult:    { low: 40, high: 999 }
      female_adult:  { low: 50, high: 999 }

  triglycerides:
    aliases: ["triglycerides", "tg"]
    unit: "mg/dL"
    ranges:
      adult: { low: 0, high: 150 }

  sodium:
    aliases: ["sodium", "na+", "na"]
    unit: "mmol/L"
    ranges:
      adult: { low: 135, high: 145 }

  potassium:
    aliases: ["potassium", "k+", "k"]
    unit: "mmol/L"
    ranges:
      adult: { low: 3.5, high: 5.0 }

  chloride:
    aliases: ["chloride", "cl-", "cl"]
    unit: "mmol/L"
    ranges:
      adult: { low: 98, high: 107 }

  bicarbonate:
    aliases: ["bicarbonate", "hco3"]
    unit: "mmol/L"
    ranges:
      adult: { low: 22, high: 29 }

  bun:
    aliases: ["bun", "blood urea nitrogen", "urea"]
    unit: "mg/dL"
    ranges:
      adult: { low: 7, high: 20 }

  creatinine:
    aliases: ["creatinine", "creat"]
    unit: "mg/dL"
    ranges:
      male_adult:    { low: 0.7, high: 1.3 }
      female_adult:  { low: 0.6, high: 1.1 }

  egfr:
    aliases: ["egfr", "estimated gfr"]
    unit: "mL/min/1.73m²"
    ranges:
      adult: { low: 90, high: 999 }

  ast:
    aliases: ["ast", "sgot"]
    unit: "U/L"
    ranges:
      adult: { low: 10, high: 40 }

  alt:
    aliases: ["alt", "sgpt"]
    unit: "U/L"
    ranges:
      adult: { low: 7, high: 56 }

  alkaline_phosphatase:
    aliases: ["alp", "alkaline phosphatase"]
    unit: "U/L"
    ranges:
      adult: { low: 44, high: 147 }

  total_bilirubin:
    aliases: ["total bilirubin", "bilirubin total"]
    unit: "mg/dL"
    ranges:
      adult: { low: 0.1, high: 1.2 }

  direct_bilirubin:
    aliases: ["direct bilirubin"]
    unit: "mg/dL"
    ranges:
      adult: { low: 0.0, high: 0.3 }

  total_protein:
    aliases: ["total protein"]
    unit: "g/dL"
    ranges:
      adult: { low: 6.0, high: 8.3 }

  albumin:
    aliases: ["albumin"]
    unit: "g/dL"
    ranges:
      adult: { low: 3.5, high: 5.0 }

  calcium:
    aliases: ["calcium", "ca"]
    unit: "mg/dL"
    ranges:
      adult: { low: 8.5, high: 10.2 }

  magnesium:
    aliases: ["magnesium", "mg"]
    unit: "mg/dL"
    ranges:
      adult: { low: 1.7, high: 2.2 }

  phosphate:
    aliases: ["phosphate", "po4"]
    unit: "mg/dL"
    ranges:
      adult: { low: 2.5, high: 4.5 }

  uric_acid:
    aliases: ["uric acid"]
    unit: "mg/dL"
    ranges:
      male_adult:    { low: 3.4, high: 7.0 }
      female_adult:  { low: 2.4, high: 6.0 }

  tsh:
    aliases: ["tsh", "thyroid stimulating hormone"]
    unit: "mIU/L"
    ranges:
      adult: { low: 0.4, high: 4.0 }

  free_t4:
    aliases: ["free t4", "ft4"]
    unit: "ng/dL"
    ranges:
      adult: { low: 0.8, high: 1.8 }

  free_t3:
    aliases: ["free t3", "ft3"]
    unit: "pg/mL"
    ranges:
      adult: { low: 2.3, high: 4.2 }

  vitamin_d:
    aliases: ["vitamin d", "25-oh vitamin d", "25-hydroxy vitamin d"]
    unit: "ng/mL"
    ranges:
      adult: { low: 30, high: 100 }

  vitamin_b12:
    aliases: ["vitamin b12", "b12"]
    unit: "pg/mL"
    ranges:
      adult: { low: 200, high: 900 }

  ferritin:
    aliases: ["ferritin"]
    unit: "ng/mL"
    ranges:
      male_adult:    { low: 30, high: 400 }
      female_adult:  { low: 13, high: 150 }

  iron:
    aliases: ["iron", "serum iron"]
    unit: "µg/dL"
    ranges:
      adult: { low: 60, high: 170 }

  crp:
    aliases: ["crp", "c reactive protein"]
    unit: "mg/L"
    ranges:
      adult: { low: 0, high: 10 }

  esr:
    aliases: ["esr", "erythrocyte sedimentation rate"]
    unit: "mm/hr"
    ranges:
      male_adult:    { low: 0, high: 15 }
      female_adult:  { low: 0, high: 20 }

  inr:
    aliases: ["inr"]
    unit: ""
    ranges:
      adult: { low: 0.8, high: 1.2 }

  ptt:
    aliases: ["ptt", "aptt"]
    unit: "seconds"
    ranges:
      adult: { low: 25, high: 35 }

  d_dimer:
    aliases: ["d-dimer", "d dimer"]
    unit: "ng/mL"
    ranges:
      adult: { low: 0, high: 500 }

  postprandial_glucose:
    aliases: ["postprandial glucose", "ppbs", "postprandial blood sugar", "2-hour postprandial glucose", "2 hr ppbs", "pp glucose", "2-hour postprandial blood sugar"]
    unit: "mg/dL"
    ranges:
      adult: { low: 70, high: 140 }

  urine_protein:
    aliases: ["urine protein", "protein urine", "proteinuria", "u-prot", "urinary protein"]
    unit: "mg/dL"
    ranges:
      adult: { low: 0, high: 20 }

  microalbumin:
    aliases: ["microalbumin", "urine microalbumin", "microalbuminuria", "u-alb", "urinary microalbumin", "uacr", "albumin creatinine ratio"]
    unit: "mg/L"
    ranges:
      adult: { low: 0, high: 30 }
