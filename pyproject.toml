[project]
name = "pulsepoint-ai"
version = "0.1.0"
description = "PulsePoint — AI/ML services for the AI Family Health Network"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "PulsePoint Team" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "litellm>=1.52",
    "openai>=1.54",
    "google-generativeai>=0.8",
    "tiktoken>=0.8",
    "pdfplumber>=0.11",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "trafilatura>=1.12",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "sentry-sdk[fastapi]>=2.18",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b2",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.44; sys_platform != 'darwin'",
    "accelerate>=1.1",
    "datasets>=3.1",
    "evaluate>=0.4",
    "mlflow>=2.17",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsepoint_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["notebooks", "data", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/pulsepoint_ai"]
omit = ["*/notebooks/*", "*/scripts/*"]
